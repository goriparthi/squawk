<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142229"/><stop offset="1" stop-color="#070B0D"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374B56"/><stop offset="1" stop-color="#1E2C34"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#C8FFF3"/><stop offset="0.55" stop-color="#67E8D0"/>
      <stop offset="1" stop-color="#37BFA8"/>
    </radialGradient>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#g)"/>
  <rect x="43" y="43" width="426" height="426" rx="98" fill="none" stroke="#26363D" stroke-width="4"/>

  <!-- Ears -->
  <rect x="92" y="212" width="42" height="96" rx="20" fill="#67E8D0"/>
  <rect x="378" y="212" width="42" height="96" rx="20" fill="#67E8D0"/>

  <!-- Head -->
  <rect x="122" y="128" width="268" height="256" rx="72" fill="url(#shell)"
        stroke="#4A6270" stroke-width="3"/>
  <!-- Visor -->
  <rect x="152" y="158" width="208" height="176" rx="46" fill="#0B1418"/>

  <!-- Eyes -->
  <circle cx="211" cy="246" r="34" fill="url(#eye)"/>
  <circle cx="301" cy="246" r="34" fill="url(#eye)"/>

  <!-- The chest badge, which is the only place the amber cursor still fits:
       it is what the pet shows when something is waiting. -->
  <rect x="214" y="408" width="38" height="24" rx="11" fill="#F6B94E"/>
  <rect x="260" y="408" width="38" height="24" rx="11" fill="#F6B94E"/>
</svg>
